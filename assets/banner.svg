<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>

    <style>
      @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
      @keyframes barGrow { from{width:0} to{width:480px} }
      @keyframes scan    { 0%{transform:translateY(0)} 100%{transform:translateY(420px)} }

      /* Pure fade-up — zero blur */
      @keyframes rowReveal {
        0%   { opacity:0; transform:translateY(12px) }
        100% { opacity:1; transform:translateY(0) }
      }
      @keyframes logoShimmer {
        0%,100% { opacity:.87 }
        50%     { opacity:1 }
      }
      @keyframes dotDrop {
        0%   { opacity:0; transform:scale(0) translateY(-6px) }
        55%  { opacity:1; transform:scale(1.4) translateY(2px) }
        75%  { transform:scale(0.85) translateY(0) }
        100% { opacity:1; transform:scale(1) translateY(0) }
      }
      @keyframes dotWave {
        0%,100% { opacity:.5 }
        50%     { opacity:1  }
      }

      .sub { font-family:'Courier New',Courier,monospace; font-size:10.5px; fill:#4a4a6a; letter-spacing:6.5px; }
      .sl  { font-family:'Courier New',Courier,monospace; font-size:10.5px; fill:#00e5ff; letter-spacing:2px; }
      .sr  { font-family:'Courier New',Courier,monospace; font-size:10.5px; fill:#ce93d8; letter-spacing:2px; }
      .pct { font-family:'Courier New',Courier,monospace; font-size:10.5px; fill:#3a3a5a; }

      .a2 { opacity:0; animation:fadeIn .6s ease forwards 1.20s }
      .a4 { opacity:0; animation:fadeIn .5s ease forwards 1.80s }
      .a5 { opacity:0; animation:fadeIn .4s ease forwards 2.10s }
      /* barGrow now targets 480px */
      .bw { width:0; animation:barGrow 2.6s cubic-bezier(.4,0,.2,1) forwards 2.15s }
      .sc { animation:scan 4s linear infinite; opacity:.03 }

      /* Logo rows — no filter, pure fade-up */
      .r1 { opacity:0; animation:rowReveal .5s ease-out forwards .08s, logoShimmer 3.5s ease-in-out infinite .65s }
      .r2 { opacity:0; animation:rowReveal .5s ease-out forwards .22s, logoShimmer 3.5s ease-in-out infinite .79s }
      .r3 { opacity:0; animation:rowReveal .5s ease-out forwards .36s, logoShimmer 3.5s ease-in-out infinite .93s }
      .r4 { opacity:0; animation:rowReveal .5s ease-out forwards .50s, logoShimmer 3.5s ease-in-out infinite 1.07s }
      .r5 { opacity:0; animation:rowReveal .5s ease-out forwards .64s, logoShimmer 3.5s ease-in-out infinite 1.21s }
      .r6 { opacity:0; animation:rowReveal .5s ease-out forwards .78s, logoShimmer 3.5s ease-in-out infinite 1.35s }
    </style>
  </defs>

  <rect width="900" height="420" fill="#05070d"/>
  <rect width="900" height="420" fill="#000" opacity="0.45"/>

  <!-- Scanline -->
  <rect width="900" height="2" class="sc" fill="#00e5ff"/>

  <!-- Dot grid top -->
  <g opacity="0.07" fill="#00e5ff">
    <circle cx="50"  cy="28" r="1"/><circle cx="110" cy="28" r="1"/><circle cx="170" cy="28" r="1"/>
    <circle cx="230" cy="28" r="1"/><circle cx="290" cy="28" r="1"/><circle cx="350" cy="28" r="1"/>
    <circle cx="410" cy="28" r="1"/><circle cx="470" cy="28" r="1"/><circle cx="530" cy="28" r="1"/>
    <circle cx="590" cy="28" r="1"/><circle cx="650" cy="28" r="1"/><circle cx="710" cy="28" r="1"/>
    <circle cx="770" cy="28" r="1"/><circle cx="830" cy="28" r="1"/>
  </g>

  <!-- Dot grid bottom -->
  <g opacity="0.07" fill="#00e5ff">
    <circle cx="50"  cy="392" r="1"/><circle cx="110" cy="392" r="1"/><circle cx="170" cy="392" r="1"/>
    <circle cx="230" cy="392" r="1"/><circle cx="290" cy="392" r="1"/><circle cx="350" cy="392" r="1"/>
    <circle cx="410" cy="392" r="1"/><circle cx="470" cy="392" r="1"/><circle cx="530" cy="392" r="1"/>
    <circle cx="590" cy="392" r="1"/><circle cx="650" cy="392" r="1"/><circle cx="710" cy="392" r="1"/>
    <circle cx="770" cy="392" r="1"/><circle cx="830" cy="392" r="1"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.22">
    <polyline points="20,50  20,20  50,20"/>
    <polyline points="880,50 880,20 850,20"/>
    <polyline points="20,370  20,400  50,400"/>
    <polyline points="880,370 880,400 850,400"/>
  </g>

