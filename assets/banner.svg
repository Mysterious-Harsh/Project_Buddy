  <circle cx="345" cy="265" r="2.8" fill="#7a3e92" style="opacity:0;transform-box:fill-box;transform-origin:center;animation:dotDrop .42s ease forwards 1.71s,dotWave 2.5s ease-in-out infinite 2.14s"/>
