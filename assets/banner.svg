  <circle cx="465" cy="265" r="2.8" fill="#be7cc7" style="opacity:0;transform-box:fill-box;transform-origin:center;animation:dotDrop .42s ease forwards 2.03s,dotWave 2.5s ease-in-out infinite 2.46s"/>
