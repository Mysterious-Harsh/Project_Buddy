       LOGO — centered at x=450, no filter
       ════════════════════════════════════════════ -->
  <g font-family="monospace" font-size="22" text-anchor="middle">
    <text x="450" y="75"  class="r1" fill="#00ffff" style="white-space:pre;">██████╗ ██╗   ██╗██████╗ ██████╗ ██╗   ██╗</text>
    <text x="450" y="100" class="r2" fill="#00d7ff" style="white-space:pre;">██╔══██╗██║   ██║██╔══██╗██╔══██╗╚██╗ ██╔╝</text>
    <text x="450" y="125" class="r3" fill="#5fafff" style="white-space:pre;">██████╔╝██║   ██║██║  ██║██║  ██║ ╚████╔╝ </text>
    <text x="450" y="150" class="r4" fill="#8787ff" style="white-space:pre;">██╔══██╗██║   ██║██║  ██║██║  ██║  ╚██╔╝  </text>
    <text x="450" y="175" class="r5" fill="#af5fff" style="white-space:pre;">██████╔╝╚██████╔╝██████╔╝██████╔╝   ██║   </text>
    <text x="450" y="200" class="r6" fill="#875fff" style="white-space:pre;">╚═════╝  ╚═════╝ ╚═════╝ ╚═════╝    ╚═╝   </text>
  </g>

